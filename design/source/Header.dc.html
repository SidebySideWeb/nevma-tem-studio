<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TEMS — Header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="font-family: 'Archivo', sans-serif; color: #F2F0EB; background: #0A0A0A; width: 100%; border-bottom: 1px solid rgba(242,240,235,.18);">
<div style="border-bottom: 1px solid rgba(242,240,235,.12);">
<div style="max-width: 1280px; margin: 0 auto; padding: 8px 40px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #9A9A9A;">
<span style="display: flex; align-items: center; gap: 8px;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #FF4F00;"></span>[Street address], Ellinikon, Athens</span>
<span>[Phone] · [Email]</span>
</div>
</div>
<div style="max-width: 1280px; margin: 0 auto; padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; box-sizing: border-box;">
<a href="Main.dc.html" aria-label="TEMS home" style="display: block; line-height: 0;"><img src="img/tems-logo-white.png" alt="TEMS — the Ellinikon music studio" style="height: 34px; width: auto;"></a>
<nav aria-label="Main" style="display: flex; gap: 28px; flex-wrap: wrap; font-stretch: 72%; font-weight: 800; font-size: 17px; text-transform: uppercase; letter-spacing: .02em;">
<a href="Studio.dc.html" style="color: #F2F0EB; text-decoration: none; padding: 6px 0; border-bottom: 2px solid {{u.studio}};">The Studio</a>
<a href="About.dc.html" style="color: #F2F0EB; text-decoration: none; padding: 6px 0; border-bottom: 2px solid {{u.about}};">About</a>
<a href="Clients.dc.html" style="color: #F2F0EB; text-decoration: none; padding: 6px 0; border-bottom: 2px solid {{u.clients}};">Clients</a>
<a href="Sessions.dc.html" style="color: #F2F0EB; text-decoration: none; padding: 6px 0; border-bottom: 2px solid {{u.sessions}};">Sessions</a>
<a href="Contact.dc.html" style="color: #F2F0EB; text-decoration: none; padding: 6px 0; border-bottom: 2px solid {{u.contact}};">Contact</a>
</nav>
<a href="Enquire.dc.html" style="background: #FF4F00; color: #0A0A0A; text-decoration: none; padding: 13px 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;">Register interest</a>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","studio","about","clients","sessions","enquire","contact"],"default":"home"},"$preview":{"width":1440,"height":96}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'home';
const u = {};
['studio','about','clients','sessions','contact'].forEach(k => { u[k] = a === k ? '#FF4F00' : 'transparent'; });
return { u };
}
}
</script>
</body>
</html>
