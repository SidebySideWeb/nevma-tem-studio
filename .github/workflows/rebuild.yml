# Daily Vercel rebuild (footer year / time-based copy). Same hook as Sanity publish.
name: Daily rebuild

on:
  schedule:
    - cron: '10 3 * * *' # 03:10 UTC
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::Secret VERCEL_DEPLOY_HOOK is not set — skipping daily rebuild."
            echo "Add it in GitHub → Settings → Secrets → Actions:"
            echo "  Vercel project → Settings → Git → Deploy Hooks → create hook on main → paste URL as VERCEL_DEPLOY_HOOK"
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
          echo
          echo "Deploy hook accepted."
