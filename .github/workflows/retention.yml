# Weekly purge of formSubmission older than form.retentionMonths.
name: Form retention

on:
  schedule:
    - cron: '30 2 * * 1' # Monday 02:30 UTC (after backup)
  workflow_dispatch:

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete expired submissions
        env:
          # Project ID is public; secret optional (same default as ci.yml).
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID || 'btd6vnus' }}
          PUBLIC_SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET || 'production' }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: node apps/web/scripts/retention.mjs
