# Weekly purge of formSubmission older than form.retentionMonths.
name: Form retention

on:
  schedule:
    - cron: '30 2 * * 1' # Monday 02:30 UTC (after backup)
  workflow_dispatch:

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require write token
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: |
          if [ -z "$SANITY_WRITE_TOKEN" ]; then
            echo "::error::Add repo secret SANITY_WRITE_TOKEN (Editor token for project btd6vnus, forms retention)."
            exit 1
          fi

      - name: Delete expired submissions
        env:
          # Public project id — do not use secrets.X || default (empty secret stays empty).
          PUBLIC_SANITY_PROJECT_ID: btd6vnus
          PUBLIC_SANITY_DATASET: production
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: node apps/web/scripts/retention.mjs
